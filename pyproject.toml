[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-odt"
version = "0.1.0"
description = "Audited experiments for global functional subspaces in MACE"
requires-python = ">=3.10"
dependencies = [
  "ase>=3.22",
  "mace-torch==0.3.16",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
